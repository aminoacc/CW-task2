name: CI/CD Pipeline for Reading Notes Management System

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Job 1: Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/flask/requirements.txt
    
    - name: Run unit tests
      run: |
        python -m unittest discover tests
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: tests/

  # Job 2: Build Docker Image
  build-docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: app
        file: app/docker/Dockerfile
        push: false
        load: true
        tags: reading-notes-app:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Save Docker image
      run: |
        docker save reading-notes-app:${{ github.sha }} > image.tar
    
    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: image.tar

  # Job 3: Deploy (Manual trigger required)
  deploy:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'workflow_dispatch'
    
    environment: production
    
    steps:
    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image
    
    - name: Load Docker image
      run: |
        docker load --input image.tar
    
    - name: Run deployment script
      run: |
        echo "Deployment would happen here"
        echo "Image: reading-notes-app:${{ github.sha }}"

  # Job 4: Create Issue on Failure
  notify-failure:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: failure()
    
    steps:
    - name: Create Issue
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'CI/CD Pipeline Failed',
            body: 'The CI/CD pipeline failed. Please check the logs.\n\nWorkflow: ${context.workflow}\nRun ID: ${context.runId}',
            labels: ['ci-failure']
          })
